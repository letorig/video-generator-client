[build-system]  
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-video-gen"
version = "0.7.0"
description = "One async Python client for multiple video generation providers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "letorig" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
video-gen = "video_gen.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The package uses a src/ layout, so the suite has to be able to import
# video_gen straight from a source checkout. Without this, `pytest` only works
# after an editable install, which a reviewer replaying the checks should not
# have to run first (and which needs network access to resolve the build
# requirements).
pythonpath = ["src"]
